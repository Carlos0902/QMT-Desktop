[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmt"
version = "0.1.0"
description = "QMT — symbolic-learning factor production platform for off-exchange (场外) Chinese public funds (cross-sectional ranking). New architecture in qmt/factor/ per doc/techdesign/; the legacy 11-stage pipeline in qmt/pipeline/ is retained as baselines-to-beat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "QMT" }]

dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pandas",
    "numpy",
    "pyarrow",
    "duckdb",
    "requests",
    "tushare",
    "scikit-learn",
    "statsmodels",
    "typer",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "matplotlib",
    "mcp>=1.12,<2",
    "httpx",
    "portalocker>=3,<4",
    "tzdata",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[project.scripts]
qmt = "qmt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["qmt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
